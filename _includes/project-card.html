{% assign p = include.project %}
{% if p.url %}<a class="card" href="{{ p.url }}">{% else %}<div class="card">{% endif %}
  <h3>{{ p.title }}</h3>
  {% if p.period %}<span class="muted period">{{ p.period }}</span>{% endif %}
  <p>{{ p.description }}</p>
  <ul class="tags">{% for t in p.tags %}<li>{{ t }}</li>{% endfor %}</ul>
{% if p.url %}</a>{% else %}</div>{% endif %}
